<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf2">
  <title>貓咪疊疊眠</title>
  <meta name="description" content="輕輕放低小貓，合成一場大大的好夢。">
  <link rel="icon" href="../assets/sleep/cat-1-clean.png">
  <link rel="stylesheet" href="../game-nav.css">
  <link rel="stylesheet" href="sleep.css?v=wide-bed-2">
  <script defer src="../game-nav.js"></script>
</head>
<body class="sleep-page">
  <main>
    <header><h1>貓咪疊疊眠</h1></header>
    <section class="stats" aria-label="遊戲狀態">
      <div><span>今局</span><strong id="score">0</strong></div>
      <div><span>最好</span><strong id="best">0</strong></div>
      <div class="next"><span>下一隻</span><canvas id="next" width="100" height="70" aria-label="下一隻貓"></canvas></div>
    </section>
    <div class="play">
      <canvas id="game" width="450" height="680" tabindex="0" role="application" aria-label="貓咪疊疊眠。拖曳到想放的位置，放手讓小貓落下。"></canvas>
      <div id="overlay" hidden>
        <div>
          <p>床鋪滿滿，晚安了。</p>
          <h2>今晚的好夢</h2>
          <p id="result"></p>
          <button id="again">再睡一局</button>
        </div>
      </div>
    </div>
  </main>
  <nav class="game-home" aria-label="遊戲導覽"><a href="../">⌂　返回首頁</a></nav>
  <script defer src="sleep.js?v=wide-bed-2"></script>
</body>
</html>
