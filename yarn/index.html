<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf2"><title>毛冷大逃走</title><link rel="icon" href="../assets/sleep/cat-1-clean.png"><link rel="stylesheet" href="yarn.css"><link rel="stylesheet" href="../game-nav.css"><script defer src="../game-nav.js"></script></head><body><main><header><div><span class="eyebrow">第一關 · 午後的地毯</span><h1>毛冷大逃走</h1></div><button id="sound" aria-label="開啟聲音" aria-pressed="false">聲音 關</button></header><section class="stats" aria-label="遊戲狀態"><div>擊球 <strong id="shots">0</strong></div><div>最佳 <strong id="best">—</strong></div><div>目標 <strong>3 桿</strong></div></section><div class="play"><canvas id="game" width="400" height="580" tabindex="0" role="application" aria-label="拉住毛冷球向後拖，放手擊球。鍵盤左右調方向，上下調力度，空白鍵擊球。"></canvas><div id="loading" class="overlay"><p>正在鋪好地毯…</p></div><div id="win" class="overlay" hidden><section><span class="eyebrow">送到小貓身邊了</span><h2>午睡好拍檔</h2><p id="result"></p><button id="again">再挑戰一次</button></section></div></div><p id="message" role="status">拉住毛冷球向後拖，放手彈出去。</p><div class="power" aria-label="擊球力度"><i id="power"></i></div><div class="actions"><button id="undo" disabled>復原一桿</button><button id="restart">重新開始</button></div><details><summary>玩法及鍵盤操作</summary><p>向想射嘅相反方向拉，拉得越遠，力度越大。利用木塊同地毯邊反彈，將毛冷送入貓窩。可以不限次慢慢試。</p><p>鍵盤：← → 調方向，↑ ↓ 調力度，空白鍵擊球。紀錄只儲存喺呢部裝置。</p></details></main><nav class="game-home" aria-label="遊戲導覽"><a href="../">⌂　返回首頁</a></nav><script src="yarn.js"></script></body></html>
