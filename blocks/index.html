<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>貓貓方塊</title><link rel="icon" href="../assets/sleep/cat-1-clean.png"><link rel="stylesheet" href="../game-nav.css"><link rel="stylesheet" href="blocks.css"><script defer src="../game-nav.js"></script></head><body><main><header><div><small>慢慢諗，唔限時</small><h1>貓貓方塊</h1></div><button id="restart">新一局</button></header><div class="scores"><span>今局 <b id="score">0</b></span><span>最高 <b id="best">0</b></span></div><div class="board-wrap"><canvas id="board" width="640" height="640" tabindex="0" aria-label="八乘八方塊棋盤，選擇方塊後點格子擺放；方向鍵移動，空白鍵放下"></canvas><div id="over" hidden><h2>小貓坐滿晒喇</h2><p id="result"></p><button id="again">再玩一局</button></div></div><p id="message" role="status">揀一塊，再點棋盤放低；亦可以拖入去。</p><div id="tray" aria-label="三塊待放方塊"></div><p class="help">填滿行或列就消除 · 三塊用晒再補充<br>方塊唔可以旋轉，留意大塊需要嘅空間。</p></main><nav class="game-home"><a href="../">⌂　返回首頁</a></nav><script src="blocks.js"></script></body></html>
