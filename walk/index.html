<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf2"><title>留白散步</title><meta name="description" content="畫一條墨線，陪小貓慢慢散步。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='27'%3E✦%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="walk.css"></head><body><main><nav aria-label="房間"><a href="../">書房</a><a href="../sleep/">睡房</a><a href="./" aria-current="page">留白散步</a></nav><header><div><p class="eyebrow">留一點白，與主同行。</p><h1>留白散步</h1></div><button id="album">散步小畫 <span id="count">0</span></button></header><section class="settings" aria-label="散步風景"><label>季節 <select id="season"><option>春</option><option>夏</option><option>秋</option><option>冬</option></select></label><label>天氣 <select id="weather"><option>晴</option><option>雨</option><option>夜</option></select></label><span id="found">相遇 0 / 6</span></section><div class="paper"><canvas id="canvas" width="600" height="700" tabindex="0" role="application" aria-label="散步畫紙：按住拖動畫路線，貓會沿墨線行走。亦可使用方向鍵畫路線。"></canvas><span class="stamp" aria-hidden="true">慢<br>行</span></div><p id="message" role="status">在紙上畫一條線，陪小貓走走。</p><section id="reflection" hidden aria-live="polite"><p id="verse"></p><p id="reference"></p><p id="thought"></p><p id="story"></p></section><div class="actions"><button id="save">收藏今日散步</button><button id="new">換一張紙</button></div><details><summary>散步小提示</summary><p>用手指或滑鼠畫線，小貓會慢慢跟上。經過微光，就會遇見聖經故事的小插畫；停一停，小貓也會休息。沒有分數，也沒有倒數。插畫是故事的提示；經文節錄並不是故事的全部，可以按列出的章節讀下去。</p><p>方向鍵也可以畫線。散步及收藏會留在這部裝置、這個瀏覽器；最多收藏 12 幅，也可以下載成圖片。</p><div id="storybuttons" aria-label="重讀遇見的故事"></div><p id="collection">相遇圖鑑：還未遇見小東西。</p></details></main><dialog id="dialog"><header><h2 id="dialogTitle">散步小畫</h2><button id="close" aria-label="關閉">關閉</button></header><div id="gallery"></div></dialog><script src="walk.js"></script></body></html>
