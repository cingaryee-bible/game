<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf2"><title>液體貓貓</title><link rel="icon" href="../assets/sleep/cat-1-clean.png"><link rel="stylesheet" href="liquid.css"><link rel="stylesheet" href="../game-nav.css"><script defer src="../game-nav.js"></script></head><body><main><header><div><span id="levelLabel">無限紙箱 · 第 1 箱</span><h1>液體貓貓</h1></div><select id="levels" aria-label="選擇已開啟紙箱"></select></header><div class="status"><span id="progress">安頓小貓中</span><span id="moves">0 次擺放</span></div><div class="board-wrap"><canvas id="board" width="600" height="600" tabindex="0" role="application" aria-label="紙箱拼圖。先選小貓，再點紙箱放下。方向鍵移動，R 旋轉，空白鍵放下。"></canvas><div id="complete" hidden><section><p>全部啱啱好！</p><h2>呢箱小貓，裝好了。</h2><p id="result"></p><button id="next">下一個紙箱</button><button id="replay">再砌一次</button></section></div></div><p id="message" role="status">揀隻貓，再點紙箱放低；亦可以直接拖入去。</p><div class="tools"><button id="rotate" disabled>↻ 旋轉</button><button id="hint">提示</button><button id="reset">重砌</button></div><div id="tray" aria-label="等待入箱的小貓"></div><p class="help">點箱內小貓可拎返出嚟 · R 旋轉 · 空白鍵放下</p></main><nav class="game-home" aria-label="遊戲導覽"><a href="../">⌂　返回首頁</a></nav><script src="liquid.js"></script></body></html>
